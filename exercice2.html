<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>Exercice 1</title>
		<!-- Lien vers le fichier CSS -->
		<link rel="stylesheet" type="text/css" href="style.css"/>

		<!-- Lien vers le fichier JavaScript -->
		<script src="script.js" defer></script>
		
		</style>
	</head>
	<body>
		<div id="entete">
			<h1>Zone d'entete </h1>
			<div id="panier"> 
				Nbre item : <span id="idItem">0</span> 
			</div>
		</div>
		<div id="zoneContenuItem">
			
		</div>
		<div id="zoneContenuFacture">
			<table border="1" width="50%" align="center">
				<thead>
					<th>Description</th>
					<th>Quantite</th>
					<th>Prix unitaire</th>					
				</thead>
				<tbody id="corpsTableau">
				</tbody>
				<tfoot>
   					 <tr>
        				<th colspan="2">sous total :</th>
        				<th id="idSousTotal">xxx</th>
    				</tr>
    				<tr>
        				<th colspan="2">TVA :</th>
        				<th id="idTVA">xxx</th>
    				</tr>
    				<tr>
        				<th colspan="2">grand total :</th>
        				<th id="idTotal">xxx</th>
    				</tr>
				</tfoot>
			</table>
			<button id="btnContinuerMagasiner" type="button">Continuer à magasiner</button>
		</div>
		<div id="zoneDetail">
    <div id="petiteEntete">
        <span id="idFermerDialogue" onclick="fermerDialogue();">Fermer</span>
    </div>
    <img id="uneImage" />
    <div>
        Description : <span id="uneDescription">XXX</span>
    </div>
    <div>
        Prix : <span id="unPrix">XXX</span>
    </div>
    <div>
        Detail : <span id="unDetail">XXX</span>
    </div>

    <div>
        Qte : <input type="text" id="txtQuantite" value="1" />
    </div>
    <div id="unAjout">Ajouter</div>
</div>

	</body>
</html>
